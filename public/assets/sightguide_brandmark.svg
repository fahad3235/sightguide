<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="sgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#185ee0"/>
      <stop offset="60%" stop-color="#0080fb"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="sgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#185ee0" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Squircle Base Accent -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sgGlow)"/>
  
  <!-- Outer Spatial Radar Pulse Arcs -->
  <path d="M14 9 A18 18 0 0 1 34 9" stroke="url(#sgGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M39 14 A18 18 0 0 1 39 34" stroke="url(#sgGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 39 A18 18 0 0 1 14 39" stroke="url(#sgGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M9 34 A18 18 0 0 1 9 14" stroke="url(#sgGrad)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Mid Wave Pulse -->
  <path d="M17 13 A13 13 0 0 1 31 13" stroke="url(#sgGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M35 17 A13 13 0 0 1 35 31" stroke="url(#sgGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M31 35 A13 13 0 0 1 17 35" stroke="url(#sgGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M13 31 A13 13 0 0 1 13 17" stroke="url(#sgGrad)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Optical Iris Aperture Center -->
  <circle cx="24" cy="24" r="7" fill="url(#sgGrad)"/>
  <circle cx="24" cy="24" r="3.2" fill="#ffffff"/>
  <circle cx="24" cy="24" r="1.5" fill="#185ee0"/>
</svg>
