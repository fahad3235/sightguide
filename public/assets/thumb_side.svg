<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" fill="none">
  <defs>
    <linearGradient id="sdBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="90" rx="8" fill="url(#sdBg)"/>

  <!-- Walkway with Safe Clearance Path on Right -->
  <polygon points="40,24 80,24 115,90 20,90" fill="#cbd5e1" opacity="0.4"/>
  <!-- Green Safe Lane Arrow on Right -->
  <path d="M78 40 L78 72 M72 50 L78 40 L84 50" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="66" y="74" width="24" height="10" rx="3" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="78" y="81.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="700" fill="#15803d" text-anchor="middle">CLEAR</text>

  <!-- Architectural Lamppost on Left -->
  <g transform="translate(18, 12)">
    <!-- Pole & Base -->
    <rect x="11" y="8" width="4" height="62" rx="2" fill="#334155"/>
    <rect x="7" y="68" width="12" height="4" rx="1.5" fill="#1e293b"/>
    <!-- Lamp Head Arm -->
    <path d="M13 14 C13 6, 26 6, 26 14" stroke="#334155" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M22 14 L30 14 L28 20 L24 20 Z" fill="#64748b"/>
    <circle cx="26" cy="21" r="2" fill="#fbbf24"/>

    <!-- AI Bounding Box for Pole -->
    <rect x="2" y="2" width="32" height="70" rx="6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <!-- Tag -->
    <rect x="2" y="-9" width="30" height="11" rx="3.5" fill="url(#amberGrad)"/>
    <text x="17" y="-1.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">POLE</text>
  </g>
</svg>
