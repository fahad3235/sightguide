<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" fill="none">
  <defs>
    <linearGradient id="drBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="90" rx="8" fill="url(#drBg)"/>

  <!-- Pavement Grid -->
  <rect x="15" y="25" width="90" height="55" rx="6" fill="#cbd5e1" opacity="0.6"/>
  <line x1="15" y1="52" x2="105" y2="52" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="25" x2="60" y2="80" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Open Drain Grate / Hole in Ground -->
  <g transform="translate(34, 38)">
    <ellipse cx="26" cy="18" rx="24" ry="12" fill="#0f172a"/>
    <ellipse cx="26" cy="18" rx="21" ry="9" stroke="#475569" stroke-width="2" fill="#1e293b"/>
    <!-- Metal Grate Bars -->
    <line x1="14" y1="18" x2="38" y2="18" stroke="#64748b" stroke-width="2"/>
    <line x1="18" y1="13" x2="34" y2="13" stroke="#64748b" stroke-width="2"/>
    <line x1="18" y1="23" x2="34" y2="23" stroke="#64748b" stroke-width="2"/>

    <!-- AI Surface Hazard Detection Box -->
    <rect x="-4" y="0" width="60" height="36" rx="6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="12" y="-10" width="30" height="11" rx="3.5" fill="url(#amberGrad)"/>
    <text x="27" y="-2" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">DRAIN</text>
  </g>
</svg>
