<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" fill="none">
  <defs>
    <linearGradient id="vhBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="90" rx="8" fill="url(#vhBg)"/>

  <!-- Roadway -->
  <polygon points="35,28 85,28 115,90 5,90" fill="#475569"/>
  <line x1="60" y1="32" x2="60" y2="90" stroke="#f8fafc" stroke-width="2" stroke-dasharray="6 4" opacity="0.8"/>

  <!-- Car Approaching in Center -->
  <g transform="translate(36, 32)">
    <!-- Shadow -->
    <ellipse cx="24" cy="42" rx="26" ry="5" fill="#0f172a" opacity="0.35"/>
    
    <!-- Vehicle Roof & Cabin -->
    <path d="M12 18 L16 8 L32 8 L36 18 Z" fill="#1e293b"/>
    <path d="M14 16 L17 10 L31 10 L34 16 Z" fill="#93c5fd" opacity="0.85"/>
    
    <!-- Vehicle Body -->
    <rect x="6" y="18" width="36" height="18" rx="5" fill="#2563eb"/>
    <rect x="8" y="24" width="32" height="10" rx="3" fill="#1d4ed8"/>

    <!-- Headlights -->
    <rect x="8" y="22" width="6" height="4" rx="1.5" fill="#fef08a"/>
    <rect x="34" y="22" width="6" height="4" rx="1.5" fill="#fef08a"/>

    <!-- Wheels -->
    <rect x="5" y="32" width="5" height="10" rx="2" fill="#0f172a"/>
    <rect x="38" y="32" width="5" height="10" rx="2" fill="#0f172a"/>

    <!-- AI Vehicle Hazard Detection Box -->
    <rect x="0" y="4" width="48" height="42" rx="6" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="6" y="-6" width="36" height="12" rx="4" fill="url(#redGrad)"/>
    <text x="24" y="2.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#ffffff" text-anchor="middle">VEHICLE</text>
  </g>
</svg>
