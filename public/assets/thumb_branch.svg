<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90" fill="none">
  <defs>
    <linearGradient id="brBg" x1="0" y1="0" x2="0" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="120" height="90" rx="8" fill="url(#brBg)"/>

  <!-- Walkway -->
  <polygon points="40,30 80,30 110,90 10,90" fill="#cbd5e1" opacity="0.35"/>

  <!-- Tree Trunk on Left -->
  <rect x="6" y="10" width="14" height="80" rx="4" fill="#57381d"/>
  <path d="M16 35 C35 32, 50 38, 76 34" stroke="#57381d" stroke-width="6" stroke-linecap="round"/>
  <path d="M50 36 C60 44, 75 42, 85 45" stroke="#57381d" stroke-width="4" stroke-linecap="round"/>

  <!-- Foliage clusters -->
  <ellipse cx="65" cy="30" rx="14" ry="9" fill="#15803d" opacity="0.85"/>
  <ellipse cx="82" cy="40" rx="16" ry="10" fill="#16a34a" opacity="0.9"/>
  <ellipse cx="45" cy="28" rx="12" ry="8" fill="#22c55e" opacity="0.8"/>

  <!-- Low Branch Hazard Detection Box -->
  <g transform="translate(36, 20)">
    <rect x="0" y="0" width="65" height="36" rx="6" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 2"/>
    <rect x="14" y="-10" width="38" height="12" rx="4" fill="url(#amberGrad)"/>
    <text x="33" y="-1.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#ffffff" text-anchor="middle">BRANCH</text>
  </g>
</svg>
